name: Deployment and container controls

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  compose-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compose configuration and OCI artifacts
        shell: bash
        run: |
          mkdir build-images
          docker version
          docker compose version
          docker buildx version
          docker compose -f compose.yaml -f compose.local.yaml config --quiet
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet
          docker buildx create --name spi-release --driver docker-container --use
          sh deploy/scripts/build-release.sh build-images
          sh deploy/scripts/load-release.sh build-images
          docker run --rm --network none spi-runtime:local python -c 'import fastapi, pymupdf, spi.api, spi.upload_worker'
          docker run --rm --network none -e SPI_SITE=https://localhost:8443 spi-proxy:local caddy adapt --config /etc/caddy/Caddyfile.local --validate
          docker run --rm --network none -e SPI_SITE=spi.example.org spi-proxy:local caddy adapt --config /etc/caddy/Caddyfile.production
      - uses: actions/upload-artifact@v4
        with:
          name: spi-oci-images
          path: build-images/
          if-no-files-found: error

  container-security:
    needs: compose-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: spi-oci-images
          path: build-images
      - name: Running containers and image layers
        run: |
          sh deploy/scripts/load-release.sh build-images
          docker compose --env-file /dev/null -p spi-security -f compose.yaml -f compose.local.yaml up --no-build -d --wait
          python deploy/scripts/container_check.py --project spi-security --layers 2>&1 | tee container-controls.log
      - name: Diagnose failed runtime checks
        if: failure()
        run: |
          docker compose --env-file /dev/null -p spi-security -f compose.yaml -f compose.local.yaml ps -a
          docker compose --env-file /dev/null -p spi-security -f compose.yaml -f compose.local.yaml logs --no-log-prefix monitoring | tail -n 30
          monitor=$(docker compose --env-file /dev/null -p spi-security -f compose.yaml -f compose.local.yaml ps -aq monitoring)
          if [ -n "$monitor" ]; then docker inspect --format '{{json .State}}' "$monitor"; fi
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip -r deploy/requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spi-container-controls
          path: container-controls.log
      - name: Remove disposable security project
        if: always()
        run: docker compose --env-file /dev/null -p spi-security -f compose.yaml -f compose.local.yaml down -v

  oci-scan:
    needs: compose-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: spi-oci-images
          path: build-images
      - name: Save original Trivy output and CycloneDX for both OCI subjects
        run: |
          mkdir scan-results
          failed=0
          for image in runtime proxy; do
            mkdir "build-images/$image"
            tar -xf "build-images/$image.tar" -C "build-images/$image"
            docker run --rm -v "$PWD/build-images:/images:ro" -v "$PWD/scan-results:/scan" \
              -v spi-trivy-ci:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 8m \
              --platform linux/amd64 --input "/images/$image" --scanners vuln,secret --no-progress --format json \
              --output "/scan/$image.json" || failed=1
            docker run --rm -v "$PWD/build-images:/images:ro" -v "$PWD/scan-results:/scan" \
              -v spi-trivy-ci:/root/.cache/trivy "$TRIVY_IMAGE" image --timeout 8m \
              --platform linux/amd64 --input "/images/$image" --format cyclonedx --no-progress \
              --output "/scan/$image.cdx.json" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spi-oci-scans-and-sboms
          path: scan-results/*.json
          if-no-files-found: error

  backend-and-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r deploy/requirements.lock
      - run: python -m pip install --no-deps -e . && python -m pip install 'pytest>=8,<10'
      - run: python -m pytest -q --junitxml=backend-fixtures.xml
      - working-directory: frontend_redezigned
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm build
          pnpm test
          pnpm audit --prod --audit-level high
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spi-regression-reports
          path: |
            backend-fixtures.xml
            frontend_redezigned/test-results/*.xml

  deployment-integration:
    needs: compose-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: spi-oci-images
          path: build-images
      - run: sh deploy/scripts/load-release.sh build-images
      - run: |
          python -m pip install --require-hashes -r deploy/requirements.lock
          python -m pip install --no-deps -e .
      - working-directory: frontend_redezigned
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Install the pinned restic rehearsal tool and NSS utilities
        run: |
          sudo apt-get install -y libnss3-tools
          curl --retry 3 -fsSLo "$RUNNER_TEMP/restic.bz2" \
            https://github.com/restic/restic/releases/download/v0.20.0/restic_0.20.0_linux_amd64.bz2
          echo "0ccd9fa7885074a24603b051e01bf9bd8b5e45d6a1791e9d9887e9e9372107f7  $RUNNER_TEMP/restic.bz2" | sha256sum -c
          bunzip2 "$RUNNER_TEMP/restic.bz2"
          chmod 0755 "$RUNNER_TEMP/restic"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python deploy/scripts/compose_e2e.py --browser --encrypted 2>&1 | tee compose-integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spi-deployment-integration
          path: compose-integration.log

  release-gate:
    needs: [compose-build, container-security, oci-scan, deployment-integration, backend-and-frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: spi-oci-images
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: spi-oci-scans-and-sboms
          path: evidence
      - name: Evaluate OCI policy, digests and test evidence
        run: |
          PYTHONPATH=src python -m spi.ops.release evidence --revision "$(git rev-parse HEAD)" \
            --check "build=${{ needs.compose-build.result }}" \
            --check "runtime_controls=${{ needs.container-security.result }}" \
            --check "trivy=${{ needs.oci-scan.result }}" \
            --check "deployment_integration=${{ needs.deployment-integration.result }}" \
            --check "regression=${{ needs.backend-and-frontend.result }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spi-release-manifest
          path: evidence/release-manifest.json
