name: Deployment and container controls

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/site-release]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  compose-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compose configuration and images
        run: |
          docker version
          docker compose version
          docker compose -f compose.yaml -f compose.local.yaml config --quiet
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet
          docker compose -f compose.yaml -f compose.local.yaml build
          docker run --rm --network none spi-runtime:local python -c 'import fastapi, pymupdf, spi.api, spi.upload_worker'
          docker run --rm --network none -e SPI_SITE=https://localhost:8443 spi-proxy:local caddy adapt --config /etc/caddy/Caddyfile.local --validate
          docker run --rm --network none -e SPI_SITE=spi.example.org spi-proxy:local caddy adapt --config /etc/caddy/Caddyfile.production
          docker image inspect spi-runtime:local spi-proxy:local --format '{{.Config.User}} {{.Size}} bytes'
      - name: Save built images for runtime jobs
        run: docker image save spi-runtime:local spi-proxy:local | gzip > spi-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: spi-images
          path: spi-images.tar.gz
          retention-days: 2

  container-security:
    needs: compose-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: spi-images
      - name: Running containers and image layers
        run: |
          docker load -i spi-images.tar.gz
          docker compose -p spi-security -f compose.yaml -f compose.local.yaml up -d --wait
          python deploy/scripts/container_check.py --project spi-security --layers
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip -r deploy/requirements.lock
      - name: Full OCI vulnerability and secrets report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/spi-scans"
          docker image save spi-runtime:local -o "$RUNNER_TEMP/spi-scans/runtime.tar"
          docker image save spi-proxy:local -o "$RUNNER_TEMP/spi-scans/proxy.tar"
          for image in runtime proxy; do
            docker run --rm -v "$RUNNER_TEMP/spi-scans:/scan" -v spi-trivy-ci:/root/.cache/trivy \
              ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --timeout 8m --input "/scan/$image.tar" --scanners vuln,secret --no-progress --format json --output "/scan/$image.json"
          done
          python - "$RUNNER_TEMP/spi-scans" <<'PY'
          import json, pathlib, sys
          failed = False
          for path in sorted(pathlib.Path(sys.argv[1]).glob("*.json")):
              results = json.loads(path.read_text())["Results"]
              vulnerabilities = [item for result in results for item in result.get("Vulnerabilities", [])]
              critical = sorted({item["VulnerabilityID"] for item in vulnerabilities if item["Severity"] == "CRITICAL"})
              high = sorted({item["VulnerabilityID"] for item in vulnerabilities if item["Severity"] == "HIGH"})
              secrets = sum(len(result.get("Secrets", [])) for result in results)
              print(path.stem, "critical", critical, "high", high, "secret matches", secrets)
              failed |= bool(critical or secrets)
          raise SystemExit(failed)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spi-image-scans
          path: ${{ runner.temp }}/spi-scans/*.json
      - name: Remove disposable security project
        if: always()
        run: docker compose -p spi-security -f compose.yaml -f compose.local.yaml down -v

  deployment-integration:
    needs: compose-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: spi-images
      - run: docker load -i spi-images.tar.gz
      - run: |
          python -m pip install --require-hashes -r deploy/requirements.lock
          python -m pip install --no-deps -e .
      - working-directory: frontend_redezigned
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y libnss3-tools
      - run: python deploy/scripts/compose_e2e.py --browser
