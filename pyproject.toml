[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-pdf-intelligence"
version = "0.1.0"
description = "Evidence-first extraction from scientific PDFs (Solar and RAG)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyMuPDF>=1.24,<2",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.32,<1",
  "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
