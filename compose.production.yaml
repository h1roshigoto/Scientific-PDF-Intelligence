x-production-env: &production-env
  SPI_DEPLOYMENT_PROFILE: production
  SPI_PUBLIC_DOMAIN: ${SPI_PUBLIC_DOMAIN:?Set SPI_PUBLIC_DOMAIN}
  SPI_PUBLIC_ORIGIN: ${SPI_PUBLIC_ORIGIN:?Set SPI_PUBLIC_ORIGIN}
  SPI_AUTH_ALLOWED_ORIGINS: ${SPI_AUTH_ALLOWED_ORIGINS:?Set SPI_AUTH_ALLOWED_ORIGINS}
  SPI_AUTH_SECRET_FILE: /run/spi-auth-secret

x-secret: &secret
  type: bind
  source: ${SPI_HOST_AUTH_SECRET_FILE:?Set SPI_HOST_AUTH_SECRET_FILE}
  target: /run/spi-auth-secret
  read_only: true
  bind: {create_host_path: false}

x-release-runtime: &release-runtime
  image: ${SPI_RUNTIME_REPOSITORY:?Set SPI_RUNTIME_REPOSITORY}@${SPI_RUNTIME_DIGEST:?Set SPI_RUNTIME_DIGEST}
  pull_policy: missing

services:
  initialize:
    <<: *release-runtime
  api:
    <<: *release-runtime
    build: !reset null
    environment: *production-env
    volumes:
      - *secret
  worker:
    <<: *release-runtime
    environment: *production-env
    volumes:
      - *secret
  proxy:
    build: !reset null
    image: ${SPI_PROXY_REPOSITORY:?Set SPI_PROXY_REPOSITORY}@${SPI_PROXY_DIGEST:?Set SPI_PROXY_DIGEST}
    pull_policy: missing
    command: [caddy, run, --config, /etc/caddy/Caddyfile.production, --adapter, caddyfile]
    environment:
      SPI_SITE: ${SPI_PUBLIC_DOMAIN:?Set SPI_PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
  sandbox:
    <<: *release-runtime
  monitoring:
    <<: *release-runtime
  backup:
    <<: *release-runtime
  restore:
    <<: *release-runtime
volumes:
  dataset:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPI_HOST_DATASET:?Set SPI_HOST_DATASET}
  backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPI_HOST_BACKUPS:?Set SPI_HOST_BACKUPS}
  proxy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SPI_HOST_PROXY_DATA:?Set SPI_HOST_PROXY_DATA}
